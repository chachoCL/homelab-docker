# ExcaliDash — https://excalidash.joseluna.dev
# Traefik: 00-proxies/traefik/dynamic/excalidraw.yml
# Datos: /mnt/media/alpine-app-copies-20261026/excalidraw/data (enlace ./data)

services:
  excalidraw:
    image: zimengxiong/excalidash-frontend@sha256:de12bee592b2db0bcdee1b7066283297696a3e9e3a309798f78ca6c9d6caff9c
    container_name: excalidraw
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: backend:8000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - 127.0.0.1:18431:80
    networks:
      - private
      - proxy

  backend:
    image: zimengxiong/excalidash-backend@sha256:f37cd418bcad543add138c16cdb5e6301c3065b77344125458ab462adde99f15
    container_name: excalidraw-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      AUTH_MODE: ${AUTH_MODE}
      FRONTEND_URL: ${FRONTEND_URL}
      TRUST_PROXY: ${TRUST_PROXY}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - /mnt/media/alpine-app-copies-20261026/excalidraw/data/backend-data:/app/prisma
    ports:
      - 127.0.0.1:18430:8000
    networks:
      - private

networks:
  private:
  proxy:
    external: true
