      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      WEB_CONCURRENCY: ${OUTLINE_WEB_CONCURRENCY}
    volumes:
    - type: bind
      source: /mnt/media/alpine-app-copies-20261026/outline/data/outline-data
      target: /var/lib/outline/data
      read_only: false
      bind:
        create_host_path: false
    ports:
    - target: 3000
      published: '18460'
      host_ip: 127.0.0.1
      protocol: tcp
