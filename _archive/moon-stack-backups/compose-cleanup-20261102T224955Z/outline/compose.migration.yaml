      REDIS_COLLABORATION_URL: ${POSTGRES_REDIS_COLLABORATION_URL}
      REDIS_URL: ${POSTGRES_REDIS_URL}
      SECRET_KEY: ${POSTGRES_SECRET_KEY}
      SENTRY_DSN: ${POSTGRES_SENTRY_DSN}
      SENTRY_TUNNEL: ${POSTGRES_SENTRY_TUNNEL}
      SLACK_APP_ID: ${POSTGRES_SLACK_APP_ID}
      SLACK_CLIENT_ID: ${POSTGRES_SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${POSTGRES_SLACK_CLIENT_SECRET}
      SLACK_MESSAGE_ACTIONS: ${POSTGRES_SLACK_MESSAGE_ACTIONS}
      SLACK_VERIFICATION_TOKEN: ${POSTGRES_SLACK_VERIFICATION_TOKEN}
