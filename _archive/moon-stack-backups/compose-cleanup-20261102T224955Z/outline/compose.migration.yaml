      LINEAR_CLIENT_ID: ${POSTGRES_LINEAR_CLIENT_ID}
      LINEAR_CLIENT_SECRET: ${POSTGRES_LINEAR_CLIENT_SECRET}
      LOG_LEVEL: ${POSTGRES_LOG_LEVEL}
      NODE_ENV: ${POSTGRES_NODE_ENV}
      NOTION_CLIENT_ID: ${POSTGRES_NOTION_CLIENT_ID}
      NOTION_CLIENT_SECRET: ${POSTGRES_NOTION_CLIENT_SECRET}
      OIDC_AUTH_URI: ${POSTGRES_OIDC_AUTH_URI}
      OIDC_CLIENT_ID: ${POSTGRES_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${POSTGRES_OIDC_CLIENT_SECRET}
      OIDC_DISPLAY_NAME: ${POSTGRES_OIDC_DISPLAY_NAME}
