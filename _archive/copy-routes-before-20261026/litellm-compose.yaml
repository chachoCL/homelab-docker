name: copy-litellm
services:
  adminer:
    entrypoint: null
    image: adminer@sha256:f742dcf1b6ca95733b54c4e020488ce78f3e774d73543a6ded9b4eaea8974f3d
    container_name: copy-litellm-adminer
    restart: unless-stopped
    networks:
      private:
        aliases:
        - litellm-adminer-1
        - adminer
      proxy:
        aliases:
        - copy-litellm-adminer
    labels:
      traefik.enable: 'false'
    ports:
    - target: 8080
      published: '18400'
      host_ip: 127.0.0.1
      protocol: tcp
  db:
    entrypoint: null
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: copy-litellm-db
    restart: unless-stopped
    networks:
      private:
        aliases:
        - litellm_db
        - db
    labels:
      traefik.enable: 'false'
    environment:
      POSTGRES_DB: ${DB_POSTGRES_DB}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
      POSTGRES_USER: ${DB_POSTGRES_USER}
    healthcheck:
      test:
      - CMD-SHELL
      - ${DB_HC_0}
      timeout: 5s
      interval: 2s
      retries: 10
    volumes:
    - type: bind
      source: /mnt/media/alpine-app-copies-20261026/litellm/data/postgres_data-litellm
      target: /var/lib/postgresql/data
      read_only: false
      bind:
        create_host_path: false
  litellm:
    depends_on:
      db:
        condition: service_started
        required: true
    dns:
    - 10.0.0.4
    - 10.0.0.16
    entrypoint: null
    image: docker.litellm.ai/berriai/litellm@sha256:60947db020b57e204823d3fbc8bb295c85be890d7c9adcc77fb4f5fc2fe410b2
    container_name: copy-litellm-litellm
    restart: unless-stopped
    networks:
      private:
        aliases:
        - litellm
      proxy:
        aliases:
        - copy-litellm-litellm
    labels:
      traefik.enable: 'false'
    environment:
      AWS_BEARER_TOKEN_BEDROCK: ${LITELLM_AWS_BEARER_TOKEN_BEDROCK}
      AWS_REGION_NAME: ${LITELLM_AWS_REGION_NAME}
      CANOPY_WAVE_API_KEY: ${LITELLM_CANOPY_WAVE_API_KEY}
      CANOPY_WAVE_API_KEY_FAST: ${LITELLM_CANOPY_WAVE_API_KEY_FAST}
      CLINE_API_KEY: ${LITELLM_CLINE_API_KEY}
      CLIPROXYAPI_API_KEY: ${LITELLM_CLIPROXYAPI_API_KEY}
      DATABASE_URL: ${LITELLM_DATABASE_URL}
      DEEPSEEK_API_KEY: ${LITELLM_DEEPSEEK_API_KEY}
      EXA_API_KEY: ${LITELLM_EXA_API_KEY}
      GITHUB_COPILOT_ACCESS_TOKEN_FILE: ${LITELLM_GITHUB_COPILOT_ACCESS_TOKEN_FILE}
      GITHUB_COPILOT_API_KEY_FILE: ${LITELLM_GITHUB_COPILOT_API_KEY_FILE}
      GITHUB_COPILOT_TOKEN_DIR: ${LITELLM_GITHUB_COPILOT_TOKEN_DIR}
      KILO_2_API_KEY: ${LITELLM_KILO_2_API_KEY}
      KILO_GATEWAY_API_KEY: ${LITELLM_KILO_GATEWAY_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_LITELLM_MASTER_KEY}
      MY_REDIS_PASSWORD: ${LITELLM_MY_REDIS_PASSWORD}
      OMNIROUTE_API_KEY: ${LITELLM_OMNIROUTE_API_KEY}
      OPENROUTER_API_KEY: ${LITELLM_OPENROUTER_API_KEY}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD}
      STORE_MODEL_IN_DB: ${LITELLM_STORE_MODEL_IN_DB}
      TZ: ${LITELLM_TZ}
      XIAOMI_API_KEY: ${LITELLM_XIAOMI_API_KEY}
    command:
    - ${LITELLM_CMD_0}
    healthcheck:
      test:
      - CMD-SHELL
      - ${LITELLM_HC_0}
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 40s
    volumes:
    - type: bind
      source: /mnt/media/alpine-app-copies-20261026/litellm/data/config.yaml
      target: /app/config.yaml
      read_only: false
      bind:
        create_host_path: false
    ports:
    - target: 4000
      published: '18401'
      host_ip: 127.0.0.1
      protocol: tcp
  prometheus:
    entrypoint: null
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: copy-litellm-prometheus
    restart: unless-stopped
    networks:
      private:
        aliases:
        - litellm-prometheus
        - prometheus
    labels:
      traefik.enable: 'false'
    command:
    - ${PROMETHEUS_CMD_0}
    - ${PROMETHEUS_CMD_1}
    - ${PROMETHEUS_CMD_2}
    volumes:
    - type: bind
      source: /mnt/media/alpine-app-copies-20261026/litellm/data/prometheus.yml
      target: /etc/prometheus/prometheus.yml
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /mnt/media/alpine-app-copies-20261026/litellm/data/prometheus_data
      target: /prometheus
      read_only: false
      bind:
        create_host_path: false
    ports:
    - target: 9090
      published: '18402'
      host_ip: 127.0.0.1
      protocol: tcp
  redis:
    entrypoint: null
    image: redis@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: copy-litellm-redis
    restart: unless-stopped
    networks:
      private:
        aliases:
        - redis
        - litellm-redis-1
    labels:
      traefik.enable: 'false'
    command:
    - ${REDIS_CMD_0}
    - ${REDIS_CMD_1}
    - ${REDIS_CMD_2}
    - ${REDIS_CMD_3}
    - ${REDIS_CMD_4}
    volumes:
    - type: bind
      source: /mnt/media/alpine-app-copies-20261026/litellm/data/redis-persistent
      target: /data
      bind:
        create_host_path: false
networks:
  private: {}
  proxy:
    external: true
    name: proxy
