http:
  routers:
    openwebui:
      rule: "Host(`openwebui.joseluna.dev`)"
      entryPoints:
        - https
      tls:
        certResolver: cloudflare
#      middlewares:
#        - sablier-ia@file
      service: openwebui

  services:
    openwebui:
      loadBalancer:
        servers:
          - url: "http://openwebui:8080"

  middlewares:
    openwebui-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

